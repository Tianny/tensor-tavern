# Hify 单机部署（Docker Compose）
# 架构：nginx(静态 + /api 反代) → hify-app → mysql / redis / pgvector → 外部 LLM API
# 用法见 deploy/README.md。首次启动前：cp .env.example .env 并修改三个密码。

name: hify

services:
  mysql:
    image: mysql:8.4
    container_name: hify-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/.env 配置 MYSQL_PASSWORD}
      MYSQL_DATABASE: hify
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次初始化（数据卷为空时）自动执行全量建表脚本
      - ../hify-app/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: hify-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 deploy/.env 配置 REDIS_PASSWORD}"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  pg:
    # 向量库（document_chunk 表由应用启动时幂等自建，无需初始化脚本）
    image: pgvector/pgvector:pg17
    container_name: hify-pg
    environment:
      POSTGRES_DB: hify
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:?请在 deploy/.env 配置 PGVECTOR_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hify"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: hify-app
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: hify
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PGVECTOR_HOST: pg
      PGVECTOR_PORT: 5432
      PGVECTOR_DATABASE: hify
      PGVECTOR_USERNAME: postgres
      PGVECTOR_PASSWORD: ${PGVECTOR_PASSWORD}
      HIFY_KNOWLEDGE_UPLOAD_DIR: /app/data/knowledge
      # prod profile = JSON 行式日志输出到 stdout（docker logs / K8s 采集），见 logback-spring.xml
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      TZ: ${TZ:-Asia/Shanghai}
      # JVM 内存按需调整；内网出网代理也在这里加 -Dhttps.proxyHost/-Dhttps.proxyPort
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
    volumes:
      # 知识库原始上传文件（重刷向量需要原文）
      - app-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      pg:
        condition: service_healthy
    healthcheck:
      # 应用存活探针：Tomcat 8080 端口可建立 TCP 连接即视为存活
      # （Ubuntu JRE 基础镜像无 curl/wget；HTTP 层探针 /api/v1/health 留给外部监控）
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: hify-web
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  pg-data:
  app-data:
