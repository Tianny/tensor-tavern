# Hify 前端 + API 反代（容器内生效，宿主机端口映射见 docker-compose.yml）

server {
    listen 80;
    server_name _;

    # 知识库文档上传（multipart），与后端 spring.servlet.multipart.max-request-size 一致
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 前端静态资源（Vue Router history 模式，刷新非根路径回落到 index.html）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Prometheus 抓取端点（指标经此暴露，其余 actuator 端点应用侧已限 health/prometheus）
    location /actuator/ {
        proxy_pass http://hify-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # API 反代到后端容器
    location /api/ {
        proxy_pass http://hify-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE：必须关缓冲，否则流式 token 会被攒住，前端表现为"卡住后一次性吐完"
        proxy_buffering off;
        proxy_cache off;
        # 对话单条回复 SSE 总时长上限 5m（hify.chat.sse-timeout），这里放宽到 6m 留余量
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        # keepalive 长连接（HTTP/1.1 + 空 Connection 头）
        proxy_set_header Connection "";
    }
}
