# Bean Validation 用户消息包（基名不带 locale 后缀，任何环境 locale 都回落到本文件，行为确定）。
# Hibernate Validator 插值规则：先查本包，查不到才落回 hibernate-validator 自带的英文默认值。
# 只覆盖项目实际用到的约束，新增约束时同步补充。
jakarta.validation.constraints.NotBlank.message=不能为空
jakarta.validation.constraints.NotNull.message=不能为null
jakarta.validation.constraints.NotEmpty.message=不能为空
jakarta.validation.constraints.Size.message=长度须在{min}到{max}之间
# 注意：Min/Max/DecimalMin/DecimalMax 的插值参数名是 {value}（Hibernate 约定），不是 {min}/{max}
jakarta.validation.constraints.Min.message=不能小于{value}
jakarta.validation.constraints.Max.message=不能大于{value}
jakarta.validation.constraints.Pattern.message=格式不匹配（要求：{regexp}）
jakarta.validation.constraints.DecimalMin.message=不能小于{value}
jakarta.validation.constraints.DecimalMax.message=不能大于{value}
